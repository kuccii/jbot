{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="page-title">Settings</div>

{% if saved %}
<div class="card" style="background: #e8f5e9; border: 1px solid #2e7d32; margin-bottom: 1rem;">
    <p style="color: #2e7d32;">Settings saved successfully!</p>
</div>
{% endif %}

<div id="validation-errors" class="card" style="background: #fff3e0; border: 1px solid #e65100; margin-bottom: 1rem; display: none;">
    <p style="color: #e65100;" id="validation-text"></p>
</div>

<div class="settings-tabs">
    <button class="settings-tab active" onclick="showTab('profile')">Profile</button>
    <button class="settings-tab" onclick="showTab('llm')">LLM Provider</button>
    <button class="settings-tab" onclick="showTab('discovery')">Discovery</button>
    <button class="settings-tab" onclick="showTab('application')">Application</button>
    <button class="settings-tab" onclick="showTab('notifications')">Notifications</button>
    <button class="settings-tab" onclick="showTab('webservices')">Web Services</button>
</div>

<form method="post" action="/settings" onsubmit="return validateForm()">

<div class="settings-section" id="tab-profile">
<div class="card">
    <div class="card-header">Profile</div>
    <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" value="{{ config.profile.name }}" required>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ config.profile.email }}" required>
    </div>
    <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ config.profile.phone }}">
    </div>
    <div class="form-group">
        <label>Skills (comma-separated)</label>
        <input type="text" name="skills" value="{{ config.profile.skills|join(', ') }}">
    </div>
</div>
</div>

<div class="settings-section" id="tab-llm" style="display:none;">
<div class="card">
    <div class="card-header">LLM Provider</div>
    <div class="form-group">
        <label>Provider</label>
        <select name="llm_provider" id="llm-provider">
            <option value="ollama" {{ 'selected' if config.llm.provider == 'ollama' }}>Ollama (Local)</option>
            <option value="gemini" {{ 'selected' if config.llm.provider == 'gemini' }}>Google Gemini</option>
            <option value="nim" {{ 'selected' if config.llm.provider == 'nim' }}>NVIDIA Nim</option>
            <option value="opencode" {{ 'selected' if config.llm.provider == 'opencode' }}>OpenCode Zen</option>
        </select>
    </div>
    <div class="form-group">
        <label>Model</label>
        <select name="llm_model" id="llm-model" data-current="{{ config.llm.model }}">
            <option value="deepseek-v4-flash-free" data-provider="opencode">deepseek-v4-flash-free</option>
            <option value="deepseek-v4-free" data-provider="opencode">deepseek-v4-free</option>
            <option value="deepseek-v3-free" data-provider="opencode">deepseek-v3-free</option>
            <option value="gemini-2.0-flash" data-provider="gemini">gemini-2.0-flash</option>
            <option value="gemini-1.5-flash" data-provider="gemini">gemini-1.5-flash</option>
            <option value="gemini-2.5-flash" data-provider="gemini">gemini-2.5-flash</option>
            <option value="meta/llama-3.3-70b-instruct" data-provider="nim">meta/llama-3.3-70b-instruct</option>
            <option value="meta/llama-3.1-70b-instruct" data-provider="nim">meta/llama-3.1-70b-instruct</option>
            <option value="mistralai/mistral-large" data-provider="nim">mistralai/mistral-large</option>
            <option value="" data-provider="custom">Custom (type below)</option>
        </select>
        <input type="text" id="llm-model-custom" name="llm_model_custom" value="" placeholder="Or type any model name..." style="margin-top: 0.5rem; display: none;">
    </div>
    <div class="form-group">
        <label>Embedding Model</label>
        <input type="text" name="embedding_model" value="{{ config.llm.embedding_model }}">
    </div>
    <div class="form-group">
        <label>Temperature</label>
        <input type="number" step="0.1" min="0" max="1" name="temperature" value="{{ config.llm.temperature }}">
    </div>
    <div class="form-group" id="ollama-url-group">
        <label>Ollama Base URL</label>
        <input type="text" name="ollama_base_url" value="{{ config.llm.ollama_base_url }}">
    </div>
    <div class="form-group" id="gemini-key-group">
        <label>Gemini API Key</label>
        <input type="password" name="gemini_api_key" value="" placeholder="{{ '*** saved ***' if has_gemini_key else 'Paste your Gemini API key' }}">
    </div>
    <div class="form-group" id="nim-key-group">
        <label>NVIDIA Nim API Key</label>
        <input type="password" name="nim_api_key" value="" placeholder="{{ '*** saved ***' if has_nim_key else 'Paste your NVIDIA Nim API key' }}">
    </div>
    <div class="form-group" id="opencode-key-group">
        <label>OpenCode Zen API Key</label>
        <input type="password" name="opencode_api_key" value="" placeholder="{{ '*** saved ***' if has_opencode_key else 'Paste your OpenCode Zen API key' }}">
    </div>
    <div class="form-group" id="opencode-url-group">
        <label>OpenCode Base URL</label>
        <input type="text" name="opencode_base_url" value="{{ config.llm.opencode_base_url }}">
    </div>
</div>
</div>

<div class="settings-section" id="tab-discovery" style="display:none;">
<div class="card">
    <div class="card-header">Discovery Sources</div>
    <div class="form-group">
        <label><input type="checkbox" name="source_google_search" {{ 'checked' if config.discovery.sources.google_search }}> Google Search (Firecrawl)</label>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="source_linkedin" {{ 'checked' if config.discovery.sources.linkedin }}> LinkedIn</label>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="source_twitter" {{ 'checked' if config.discovery.sources.twitter }}> Twitter/X</label>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="source_african_jobs" {{ 'checked' if config.discovery.sources.african_jobs }}> African Job Boards</label>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="source_company_pages" {{ 'checked' if config.discovery.sources.company_pages }}> Company Career Pages</label>
    </div>
    <div class="form-group">
        <label>Target Websites (one per line)</label>
        <textarea name="companies" rows="3" placeholder="https://openai.com/careers">{{ config.discovery.companies|join('\n') }}</textarea>
    </div>
    <div class="form-group">
        <label>Discovery Interval (hours)</label>
        <input type="number" name="interval_hours" value="{{ config.discovery.interval_hours }}" min="1" required>
    </div>
</div>
</div>

<div class="settings-section" id="tab-application" style="display:none;">
<div class="card">
    <div class="card-header">Application Settings</div>
    <div class="form-group">
        <label><input type="checkbox" name="human_approval" {{ 'checked' if config.application.human_approval }}> Require human approval before submitting</label>
    </div>
    <div class="form-group">
        <label><input type="checkbox" name="autonomous_apply" {{ 'checked' if config.application.autonomous_apply }}> Autonomous form filling (TinyFish/Firecrawl)</label>
    </div>
    <div class="form-group">
        <label>Max applications per run</label>
        <input type="number" name="max_applications_per_run" value="{{ config.application.max_applications_per_run }}" min="1" required>
    </div>
</div>
</div>

<div class="settings-section" id="tab-notifications" style="display:none;">
<div class="card">
    <div class="card-header">WhatsApp Notifications</div>
    <div class="form-group">
        <label><input type="checkbox" name="whatsapp_enabled" {{ 'checked' if config.notifications.whatsapp.enabled }}> Enable WhatsApp</label>
    </div>
    <div class="form-group">
        <label>Phone Number ID</label>
        <input type="text" name="whatsapp_phone_number_id" value="{{ config.notifications.whatsapp.phone_number_id }}">
    </div>
    <div class="form-group">
        <label>Token</label>
        <input type="password" name="whatsapp_token" value="" placeholder="{{ '*** saved ***' if has_whatsapp_token else 'Paste your WhatsApp token' }}">
    </div>
    <div class="form-group">
        <label>Recipient Phone</label>
        <input type="text" name="whatsapp_recipient" value="{{ config.notifications.whatsapp.recipient }}" placeholder="+250...">
    </div>
</div>
</div>

<div class="settings-section" id="tab-webservices" style="display:none;">
<div class="card">
    <div class="card-header">Web Services</div>
    <div class="form-group">
        <label>Firecrawl API Key</label>
        <input type="password" name="firecrawl_api_key" value="" placeholder="{{ '*** saved ***' if has_firecrawl_key else 'Paste your Firecrawl API key' }}">
    </div>
    <div class="form-group">
        <label>Jina Reader API Key</label>
        <input type="password" name="jina_api_key" value="" placeholder="{{ '*** saved ***' if has_jina_key else 'Paste your Jina API key' }}">
    </div>
    <div class="form-group">
        <label>TinyFish API Key</label>
        <input type="password" name="tinyfish_api_key" value="" placeholder="{{ '*** saved ***' if has_tinyfish_key else 'Paste your TinyFish API key' }}">
    </div>
</div>
</div>

<div style="margin-top: 1rem;">
    <button type="submit" class="btn btn-primary">Save Settings</button>
    <span style="color: #999; font-size: 0.85rem; margin-left: 0.5rem;">Saved to config.yaml</span>
</div>
</form>

<script>
function showTab(name) {
    document.querySelectorAll('.settings-section').forEach(s => s.style.display = 'none');
    document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + name).style.display = 'block';
    event.target.classList.add('active');
}

var FREE_MODELS = [
    {provider: 'opencode', value: 'deepseek-v4-flash-free'},
    {provider: 'opencode', value: 'deepseek-v4-free'},
    {provider: 'opencode', value: 'deepseek-v3-free'},
    {provider: 'gemini', value: 'gemini-2.0-flash'},
    {provider: 'gemini', value: 'gemini-1.5-flash'},
    {provider: 'gemini', value: 'gemini-2.5-flash'},
    {provider: 'nim', value: 'meta/llama-3.3-70b-instruct'},
    {provider: 'nim', value: 'meta/llama-3.1-70b-instruct'},
    {provider: 'nim', value: 'mistralai/mistral-large'},
];

function updateModelDropdown() {
    var provider = document.getElementById('llm-provider').value;
    var select = document.getElementById('llm-model');
    var customInput = document.getElementById('llm-model-custom');
    var currentVal = select.getAttribute('data-current') || '';
    select.innerHTML = '';
    var matched = FREE_MODELS.filter(function(m) { return m.provider === provider; });
    matched.forEach(function(m) {
        var opt = document.createElement('option');
        opt.value = m.value; opt.textContent = m.value;
        if (m.value === currentVal) opt.selected = true;
        select.appendChild(opt);
    });
    var customOpt = document.createElement('option');
    customOpt.value = ''; customOpt.textContent = 'Custom (type below)';
    select.appendChild(customOpt);
    var isInList = matched.some(function(m) { return m.value === currentVal; });
    if (currentVal && !isInList) { select.value = ''; customInput.value = currentVal; customInput.style.display = 'block'; }
    else { customInput.style.display = 'none'; }
    select.disabled = customInput.style.display === 'block';
    if (provider === 'ollama') { customInput.style.display = 'block'; customInput.placeholder = 'Enter any Ollama model name'; }
    customInput.disabled = customInput.style.display !== 'block';
}

function toggleApiKeys() {
    var provider = document.getElementById('llm-provider').value;
    document.getElementById('ollama-url-group').style.display = provider === 'ollama' ? 'block' : 'none';
    document.getElementById('gemini-key-group').style.display = provider === 'gemini' ? 'block' : 'none';
    document.getElementById('nim-key-group').style.display = provider === 'nim' ? 'block' : 'none';
    document.getElementById('opencode-key-group').style.display = provider === 'opencode' ? 'block' : 'none';
    document.getElementById('opencode-url-group').style.display = provider === 'opencode' ? 'block' : 'none';
    updateModelDropdown();
}
document.getElementById('llm-provider').addEventListener('change', toggleApiKeys);

document.querySelector('form').addEventListener('submit', function() {
    var select = document.getElementById('llm-model');
    var customInput = document.getElementById('llm-model-custom');
    if (!select.value && customInput.value) {
        select.name = ''; select.disabled = true;
        var hidden = document.createElement('input');
        hidden.type = 'hidden'; hidden.name = 'llm_model'; hidden.value = customInput.value;
        select.parentNode.appendChild(hidden);
    }
});

toggleApiKeys();

function validateForm() {
    var errors = [];
    var name = document.querySelector('[name="name"]').value.trim();
    var email = document.querySelector('[name="email"]').value.trim();
    if (!name) errors.push('Name is required.');
    if (!email) errors.push('Email is required.');
    else if (!email.includes('@')) errors.push('Email is invalid.');
    if (errors.length) {
        document.getElementById('validation-text').textContent = errors.join(' ');
        document.getElementById('validation-errors').style.display = 'block';
        return false;
    }
    return true;
}
</script>
{% endblock %}
