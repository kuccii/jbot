<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobBot - {% block title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/chart.umd.min.js"></script>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>JobBot</h2>
            </div>
            <ul class="nav-links">
                <li><a href="/" class="{{ 'active' if page == 'home' }}">Dashboard</a></li>
                <li class="nav-group">
                    <a href="/opportunities" class="{{ 'active' if page == 'opportunities' and category|default('job') in ('', 'job', 'all') }}">Jobs</a>
                    <a href="/opportunities/startup" class="nav-sub {{ 'active' if category|default('') == 'startup' }}">Startups</a>
                    <a href="/opportunities/grant" class="nav-sub {{ 'active' if category|default('') == 'grant' }}">Grants</a>
                </li>
                <li><a href="/review" class="{{ 'active' if page == 'review' }}">Review</a></li>
                <li><a href="/applications" class="{{ 'active' if page == 'applications' }}">Applications</a></li>
                <li><a href="/upwork" class="{{ 'active' if page == 'upwork' }}">Upwork</a></li>
                <li><a href="/settings" class="{{ 'active' if page == 'settings' }}">Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <small>v0.1.0</small>
            </div>
        </nav>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
