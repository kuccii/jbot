[project]
name = "job-bot"
version = "0.1.0"
description = "Automated job application discovery and submission bot"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "apscheduler>=3.10",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "playwright>=1.45",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
]

[project.scripts]
job-bot = "job_bot.cli.commands:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_bot*"]
