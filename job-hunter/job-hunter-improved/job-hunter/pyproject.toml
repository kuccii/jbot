[project]
name = "job-hunter"
version = "0.2.0"
description = "Find jobs you can actually take from Rwanda or Kenya — scrapes 15+ remote boards and ATS APIs, filters for real eligibility, scores fit against your skills, and can notify you."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
job-hunter = "job_hunter.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_hunter*"]

[tool.setuptools.package-data]
job_hunter = ["dashboard/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
