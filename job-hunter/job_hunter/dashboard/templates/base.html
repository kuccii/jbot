<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Hunter{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1117;
            --bg-card: #1a1d27;
            --bg-hover: #252836;
            --text: #e4e6eb;
            --text-muted: #8b8d97;
            --accent: #6c5ce7;
            --accent-hover: #a29bfe;
            --green: #00b894;
            --red: #e17055;
            --yellow: #fdcb6e;
            --border: #2d3142;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }

        /* Nav */
        nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        nav .logo { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
        nav a { color: var(--text-muted); font-size: 0.95rem; }
        nav a:hover, nav a.active { color: var(--text); }

        /* Container */
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text); }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-card .label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        tr:hover { background: var(--bg-hover); }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .badge-board { background: var(--accent); color: white; }
        .badge-new { background: var(--green); color: white; }
        .badge-saved { background: var(--yellow); color: #333; }
        .badge-applied { background: #0984e3; color: white; }
        .badge-hidden { background: var(--text-muted); color: white; }

        /* Filters */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .filters input:focus, .filters select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .filters button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .filters button:hover { background: var(--accent-hover); }

        /* Pagination */
        .pagination {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 2rem;
        }
        .pagination a, .pagination span {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.9rem;
        }
        .pagination a:hover { background: var(--bg-hover); }
        .pagination .active { background: var(--accent); color: white; }

        /* Job card */
        .job-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 0.75rem;
            transition: border-color 0.2s;
        }
        .job-card:hover { border-color: var(--accent); }
        .job-card h3 { font-size: 1rem; margin-bottom: 0.5rem; }
        .job-card .meta { color: var(--text-muted); font-size: 0.85rem; }
        .job-card .tags { margin-top: 0.5rem; }

        /* Detail page */
        .detail-header { margin-bottom: 2rem; }
        .detail-header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .detail-meta { display: flex; gap: 2rem; color: var(--text-muted); margin-top: 1rem; }
        .detail-body { white-space: pre-wrap; line-height: 1.8; }

        /* Actions */
        .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn:hover { background: var(--bg-hover); }
        .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); }

        /* Board list */
        .board-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
        }
        .board-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .board-item .count { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

        /* Platform cards */
        .platform-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .platform-card h3 { color: var(--accent); margin-bottom: 0.5rem; }
        .platform-card .pay { color: var(--green); font-weight: 600; }
        .platform-card .tasks { color: var(--text-muted); margin: 0.5rem 0; }
    </style>
</head>
<body>
    <nav>
        <span class="logo">🎯 Job Hunter</span>
        <a href="/" class="{% if active == 'home' %}active{% endif %}">Dashboard</a>
        <a href="/jobs" class="{% if active == 'jobs' %}active{% endif %}">Jobs</a>
        <a href="/platforms" class="{% if active == 'platforms' %}active{% endif %}">Platforms</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
