version: "3.8"

services:
  app:
    build: .
    container_name: job-hunter
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Africa/Kigali

  nginx:
    image: nginx:alpine
    container_name: job-hunter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
