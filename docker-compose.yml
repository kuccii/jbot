services:
  job-bot:
    build: .
    container_name: job-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./profile:/app/profile
    environment:
      - TZ=UTC

  job-hunter:
    build:
      context: ./job-hunter
      dockerfile: Dockerfile
    container_name: job-hunter
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./job-hunter/data:/app/data
      - ./job-hunter/config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Africa/Kigali
